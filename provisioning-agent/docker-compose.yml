# P0-1 (Audit 0430f9c): docker-socket-proxy haengt NICHT mehr in traefik-net.
#
# Vorher erreichbar aus JEDEM Kundencontainer, ohne Auth:
#   POST /containers/create mit Binds:["/:/host"] + Privileged:true -> Root auf dem Host.
# tecnativa/docker-socket-proxy filtert nur Pfad+Methode, NICHT den Request-Body —
# POST=1 + CONTAINERS=1 ist damit root-aequivalent. Die einzige wirksame Grenze ist
# das Netz, nicht die API-Gruppen-Flags.
#
# docker-proxy-net ist internal: true — kein Routing nach aussen, kein Gateway.
# Nur provisioning-agent haengt zusaetzlich darin.
services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: docker-socket-proxy
    environment:
      # Vom Agent tatsaechlich benoetigt (verifiziert gegen src/lib/deploy.ts,
      # lib/cleanup.ts, lib/traefikDynamic.ts, routes/stats.ts):
      CONTAINERS: 1   # ps/inspect/run/rm/rename/stop/start/logs/stats
      IMAGES: 1       # images/rmi/image inspect
      NETWORKS: 1     # network create/connect (Projekt-Netze, siehe deploy.ts)
      BUILD: 1        # nixpacks build laeuft ueber DOCKER_HOST
      POST: 1         # ohne POST kein run/rm/rename
      INFO: 1
      PING: 1
      # P0-1: abgeschaltet. Kein `docker exec` und keine Volume-API im Agent-Code.
      EXEC: 0
      VOLUMES: 0
      SERVICES: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      CONFIGS: 0
      DISTRIBUTION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy-net
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/lib/haproxy
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  provisioning-agent:
    build: .
    container_name: provisioning-agent
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      PROVISIONING_AGENT_SECRET: ${PROVISIONING_AGENT_SECRET}
      MASTER_DB_PASSWORD: ${MASTER_DB_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      PGBOUNCER_HOST: core-postgres
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN}
      WEBHOOK_PUBLIC_URL: ${WEBHOOK_PUBLIC_URL}
      GITHUB_PAT: ${GITHUB_PAT}
      DNS_RESOLVERS: ${DNS_RESOLVERS:-1.1.1.1,8.8.8.8,9.9.9.9}
      RESEND_API_KEY: ${RESEND_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      GODADDY_API_SECRET: ${GODADDY_API_SECRET}
      GODADDY_API_KEY: ${GODADDY_API_KEY}
      ADMIN_DB_HOST: ${ADMIN_DB_HOST:-core-postgres}
      VPS_PUBLIC_IP: ${VPS_PUBLIC_IP}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
      BACKUP_AGE_PUBLIC_KEY: ${BACKUP_AGE_PUBLIC_KEY}
      BACKUP_AGE_IDENTITY_FILE: ${BACKUP_AGE_IDENTITY_FILE}
      RCLONE_CONFIG: ${RCLONE_CONFIG}
      RCLONE_REMOTE_PATH: ${RCLONE_REMOTE_PATH}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
      # Backup-Ueberwachung (lib/backupHealth.ts): Totmannschalter, DR-Bundle,
      # automatischer Restore-Test. Alle optional, Defaults stehen im Code —
      # trotzdem durchgereicht, sonst haette ein Eintrag in der .env keinerlei
      # Wirkung und niemand wuesste warum (siehe PLATFORM_DEFAULT_NODE_VERSION
      # weiter unten, genau dieser Fall).
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-}
      BACKUP_RESTORE_TEST_INTERVAL_DAYS: ${BACKUP_RESTORE_TEST_INTERVAL_DAYS:-}
      BACKUP_DR_BUNDLE_CONFIRMED_AT: ${BACKUP_DR_BUNDLE_CONFIRMED_AT:-}
      BACKUP_DR_BUNDLE_MAX_AGE_DAYS: ${BACKUP_DR_BUNDLE_MAX_AGE_DAYS:-}
      # Nur fuer die Anzeige im Dashboard ("X von 9 GB belegt"). Die
      # Aufbewahrung selbst rechnet backup-script.sh auf dem Host.
      BACKUP_MAX_TOTAL_BYTES: ${BACKUP_MAX_TOTAL_BYTES:-}
      STARTER_POSTGREST_MEM: ${STARTER_POSTGREST_MEM}
      STARTER_POSTGREST_CPUS: ${STARTER_POSTGREST_CPUS}
      STARTER_GOTRUE_MEM: ${STARTER_GOTRUE_MEM}
      STARTER_GOTRUE_CPUS: ${STARTER_GOTRUE_CPUS}
      BUSINESS_POSTGREST_MEM: ${BUSINESS_POSTGREST_MEM}
      BUSINESS_POSTGREST_CPUS: ${BUSINESS_POSTGREST_CPUS}
      BUSINESS_GOTRUE_MEM: ${BUSINESS_GOTRUE_MEM}
      BUSINESS_GOTRUE_CPUS: ${BUSINESS_GOTRUE_CPUS}
      PREMIUM_POSTGREST_MEM: ${PREMIUM_POSTGREST_MEM}
      PREMIUM_POSTGREST_CPUS: ${PREMIUM_POSTGREST_CPUS}
      PREMIUM_GOTRUE_MEM: ${PREMIUM_GOTRUE_MEM}
      PREMIUM_GOTRUE_CPUS: ${PREMIUM_GOTRUE_CPUS}
      UPTIME_KUMA_URL: ${UPTIME_KUMA_URL}
      UPTIME_KUMA_USERNAME: ${UPTIME_KUMA_USERNAME}
      UPTIME_KUMA_PASSWORD: ${UPTIME_KUMA_PASSWORD}
      # Verschluesselt die Passwoerter der Rollen cms_<slug> (Migration 21).
      # BEWUSST ein anderer Schluessel als ENCRYPTION_MASTER_KEY, siehe
      # lib/cms.ts. Ohne ihn scheitert "CMS aktivieren" im Dashboard.
      CMS_ENCRYPTION_KEY: ${CMS_ENCRYPTION_KEY:-}
      # Besucher-Analytics. Alle optional — die Defaults stehen im Code
      # (lib/analytics.ts, lib/cleanup.ts). Trotzdem durchgereicht, sonst haette
      # ein Eintrag in der .env keinerlei Wirkung und niemand wuesste warum.
      ANALYTICS_SALT: ${ANALYTICS_SALT:-}
      ANALYTICS_ACCESS_LOG: ${ANALYTICS_ACCESS_LOG:-}
      ANALYTICS_INTERVAL_MS: ${ANALYTICS_INTERVAL_MS:-}
      ANALYTICS_ROTATE_AT_BYTES: ${ANALYTICS_ROTATE_AT_BYTES:-}
      ANALYTICS_VISITOR_RETENTION_DAYS: ${ANALYTICS_VISITOR_RETENTION_DAYS:-}
      ANALYTICS_DETAIL_RETENTION_DAYS: ${ANALYTICS_DETAIL_RETENTION_DAYS:-}
      ANALYTICS_DAILY_RETENTION_DAYS: ${ANALYTICS_DAILY_RETENTION_DAYS:-}
      # Bestand, aber nie durchgereicht: lib/nixpacks.ts liest die Variable,
      # im Container kam sie nie an.
      PLATFORM_DEFAULT_NODE_VERSION: ${PLATFORM_DEFAULT_NODE_VERSION:-}
    volumes:
      - /opt/multitenant-platform:/opt/multitenant-platform
      # Nur fuer nixpacks/BuildKit-Builds (siehe lib/nixpacks.ts) — der Proxy kann das
      # BuildKit-Session-Upgrade nicht durchreichen (403). Alle anderen Docker-Aufrufe
      # (Container run/rm/rename, Image-Prune, Netzwerke) laufen weiterhin ueber
      # DOCKER_HOST=tcp://docker-socket-proxy:2375, unveraendert. Kein zusaetzliches
      # Risiko: CONTAINERS+POST am Proxy sind bereits root-aequivalent (siehe Kommentar
      # oben in dieser Datei), der Agent hat also ohnehin schon effektiv vollen Zugriff.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - docker-socket-proxy
    networks:
      - docker-proxy-net
      - traefik-net
    restart: always
    # Audit §11: ohne mem_limit reisst ein einzelner nixpacks-Build (1-2 GB fuer
    # ein Next.js-Projekt) den Server ins OOM — und der Kernel-OOM-Killer nimmt
    # nach oom_score typischerweise PostgreSQL, also die DB ALLER Kunden.
    mem_limit: 2g
    memswap_limit: 3g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      # NUR /webhooks/* öffentlich — alle anderen Pfade brauchen weiterhin X-Agent-Secret
      # und sind über diesen Router technisch zwar erreichbar, aber ohne Secret 401.
      - "traefik.http.routers.agent-webhooks.rule=Host(`webhooks.${PLATFORM_DOMAIN:-example.com}`) && PathPrefix(`/webhooks`)"
      - "traefik.http.routers.agent-webhooks.entrypoints=websecure"
      - "traefik.http.routers.agent-webhooks.tls.certresolver=myresolver"
      - "traefik.http.services.agent-webhooks.loadbalancer.server.port=3001"

networks:
  traefik-net:
    external: true
  # P0-1: nur Agent <-> Socket-Proxy. internal: true = kein Gateway, kein Egress.
  docker-proxy-net:
    name: docker-proxy-net
    internal: true
