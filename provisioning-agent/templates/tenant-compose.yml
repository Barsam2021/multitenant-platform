services:
  api:
    image: postgrest/postgrest:v14.15
    container_name: api-${SLUG}
    environment:
      PGRST_DB_URI: "postgres://${AUTH_ROLE}:${AUTH_PW}@pgbouncer:5432/kunde_${SLUG}"
      PGRST_DB_SCHEMA: "public"
      # P0-2b: tenant-eigene Rolle statt der clusterweiten "anon".
      PGRST_DB_ANON_ROLE: "anon_${SLUG}"
      PGRST_JWT_SECRET: "${JWT_SECRET}"
      # P1-10: PgBouncer laeuft mit POOL_MODE=transaction. Prepared Statements
      # sind Session-State — Folge-Requests landen auf einer anderen Server-
      # Verbindung und quittieren mit "prepared statement does not exist".
      # PostgREST-Default ist true, PostgREST dokumentiert die Kombination
      # explizit als inkompatibel. Sporadische 500er unter Last.
      PGRST_DB_PREPARED_STATEMENTS: "false"
      # Audit §5: Default 10 pro Tenant war bei 20 Tenants die Haelfte des
      # PgBouncer-Budgets allein fuer PostgREST.
      PGRST_DB_POOL: "5"
    mem_limit: ${POSTGREST_MEM}
    cpus: ${POSTGREST_CPUS}
    # Image-eigenen HEALTHCHECK explizit deaktivieren (nicht nur weglassen!):
    # postgrest/postgrest bringt selbst einen wget-basierten HEALTHCHECK im
    # Dockerfile mit, der ohne diesen "disable: true" von Compose übernommen
    # würde — und genau wie unser vorheriger Check technisch unausführbar ist,
    # weil das Image weder Shell noch wget/curl/nc enthält.
    healthcheck:
      disable: true
    networks:
      - traefik-net
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  auth:
    image: supabase/gotrue:v2.193.1
    container_name: auth-${SLUG}
    environment:
      GOTRUE_JWT_SECRET: "${JWT_SECRET}"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgres://${AUTH_ROLE}:${AUTH_PW}@pgbouncer:5432/kunde_${SLUG}?search_path=auth"
      GOTRUE_SITE_URL: "https://${SLUG}.${PLATFORM_DOMAIN}"
      GOTRUE_API_HOST: "0.0.0.0"
      # P1-7: explizit statt Image-Default — der Healthcheck unten muss exakt
      # denselben Port treffen. War vorher implizit 9999 (GoTrue-Default), der
      # Healthcheck fragte aber 8081 ab und schlug seit je her fehl, ohne dass
      # es im laufenden Betrieb auffiel (Container blieb trotzdem "unhealthy").
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: "https://${SLUG}.${PLATFORM_DOMAIN}"
      # P0-2b: der role-Claim in GoTrue-Tokens muss die tenant-eigene Rolle
      # nennen, sonst macht PostgREST SET ROLE auf die clusterweite Rolle
      # (die authenticator_<slug> nach der Migration nicht mehr annehmen darf).
      GOTRUE_JWT_DEFAULT_GROUP_NAME: "authenticated_${SLUG}"
      GOTRUE_JWT_ADMIN_ROLES: "service_role_${SLUG}"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: smtp.resend.com
      GOTRUE_SMTP_PORT: "465"
      GOTRUE_SMTP_USER: resend
      GOTRUE_SMTP_PASS: "${RESEND_API_KEY}"
      GOTRUE_SMTP_SENDER_NAME: "${TENANT_NAME}"
      # P2-11: offene Registrierung war Default auf JEDER Kunden-Auth-Instanz.
      # Wer Self-Signup braucht, schaltet es pro Tenant bewusst frei.
      GOTRUE_DISABLE_SIGNUP: "true"
    mem_limit: ${GOTRUE_MEM}
    cpus: ${GOTRUE_CPUS}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9999/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - traefik-net
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik-net:
    external: true
