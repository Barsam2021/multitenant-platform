services:
  api:
    image: postgrest/postgrest:v14.15
    container_name: api-${SLUG}
    environment:
      PGRST_DB_URI: "postgres://${AUTH_ROLE}:${AUTH_PW}@pgbouncer:5432/kunde_${SLUG}"
      PGRST_DB_SCHEMA: "public"
      PGRST_DB_ANON_ROLE: "anon"
      PGRST_JWT_SECRET: "${JWT_SECRET}"
    mem_limit: ${POSTGREST_MEM}
    cpus: ${POSTGREST_CPUS}
    # Image-eigenen HEALTHCHECK explizit deaktivieren (nicht nur weglassen!):
    # postgrest/postgrest bringt selbst einen wget-basierten HEALTHCHECK im
    # Dockerfile mit, der ohne diesen "disable: true" von Compose übernommen
    # würde — und genau wie unser vorheriger Check technisch unausführbar ist,
    # weil das Image weder Shell noch wget/curl/nc enthält.
    healthcheck:
      disable: true
    networks:
      - traefik-net
    restart: always

  auth:
    image: supabase/gotrue:v2.193.1
    container_name: auth-${SLUG}
    environment:
      GOTRUE_JWT_SECRET: "${JWT_SECRET}"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgres://${AUTH_ROLE}:${AUTH_PW}@pgbouncer:5432/kunde_${SLUG}?search_path=auth"
      GOTRUE_SITE_URL: "https://${SLUG}.${PLATFORM_DOMAIN}"
      GOTRUE_API_HOST: "0.0.0.0"
      # P1-7: explizit statt Image-Default — der Healthcheck unten muss exakt
      # denselben Port treffen. War vorher implizit 9999 (GoTrue-Default), der
      # Healthcheck fragte aber 8081 ab und schlug seit je her fehl, ohne dass
      # es im laufenden Betrieb auffiel (Container blieb trotzdem "unhealthy").
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: "https://${SLUG}.${PLATFORM_DOMAIN}"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: smtp.resend.com
      GOTRUE_SMTP_PORT: "465"
      GOTRUE_SMTP_USER: resend
      GOTRUE_SMTP_PASS: "${RESEND_API_KEY}"
      GOTRUE_SMTP_SENDER_NAME: "${TENANT_NAME}"
      GOTRUE_DISABLE_SIGNUP: "false"
    mem_limit: ${GOTRUE_MEM}
    cpus: ${GOTRUE_CPUS}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9999/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - traefik-net
    restart: always

networks:
  traefik-net:
    external: true
