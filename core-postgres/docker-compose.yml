services:
  core-postgres:
    image: postgres:16.14-bookworm
    container_name: core-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MASTER_DB_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - max_connections=150
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - traefik-net

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: pgbouncer
    ports:
      - "127.0.0.1:6432:5432"
    environment:
      DB_HOST: core-postgres
      DB_USER: postgres
      DB_PASSWORD: ${MASTER_DB_PASSWORD}
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: search_path
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
    depends_on:
      core-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - traefik-net

volumes:
  pgdata:

networks:
  traefik-net:
    external: true
